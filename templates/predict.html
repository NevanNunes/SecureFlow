{% extends "base.html" %}

{% block content %}
<div class="fade-in">
    <div class="text-center mb-4">
        <h2>Fraud Prediction</h2>
        <p class="text-muted">Analyze single transactions or batch process CSV files</p>
    </div>

    <div class="grid grid-2">
        <!-- Single Prediction Form -->
        <div class="card">
            <h3 class="mb-4"><i class="fas fa-user"></i> Single Transaction</h3>
            <form id="predict-form">
                <div class="form-group">
                    <label class="form-label">Transaction Type</label>
                    <select name="type" class="form-control" required>
                        <option value="PAYMENT">PAYMENT</option>
                        <option value="TRANSFER">TRANSFER</option>
                        <option value="CASH_OUT">CASH_OUT</option>
                        <option value="DEBIT">DEBIT</option>
                        <option value="CASH_IN">CASH_IN</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Amount</label>
                    <input type="number" name="amount" class="form-control" step="0.01" required>
                </div>
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">Old Balance (Origin)</label>
                        <input type="number" name="oldbalanceOrg" class="form-control" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">New Balance (Origin)</label>
                        <input type="number" name="newbalanceOrig" class="form-control" step="0.01" required>
                    </div>
                </div>
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label">Old Balance (Dest)</label>
                        <input type="number" name="oldbalanceDest" class="form-control" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">New Balance (Dest)</label>
                        <input type="number" name="newbalanceDest" class="form-control" step="0.01" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Time Step (Hour)</label>
                    <input type="number" name="step" class="form-control" value="1" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%">
                    Analyze Transaction
                </button>
            </form>

            <!-- Result Display -->
            <div id="result-section" class="mt-4 hidden">
                <div id="result-card" class="card" style="background: rgba(0,0,0,0.2);">
                    <h4 id="result-title" class="text-center mb-2"></h4>
                    <div class="text-center">
                        <p id="result-probability" class="h5 mb-2"></p>
                        <span id="result-risk" class="badge"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Batch Prediction -->
        <div class="card">
            <h3 class="mb-4"><i class="fas fa-file-csv"></i> Batch Processing</h3>
            <form id="batch-form">
                <div class="file-upload mb-4">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Drag & Drop CSV file here</p>
                    <p class="text-muted small">or click to browse</p>
                    <input type="file" id="csv-file" name="file" accept=".csv" style="display: none;">
                </div>
                <p id="file-name" class="text-center text-muted mb-4"></p>
                <button type="submit" class="btn btn-outline" style="width: 100%">
                    Process Batch
                </button>
            </form>

            <!-- Batch Results -->
            <div id="batch-result-section" class="mt-4 hidden">
                <div id="batch-summary"></div>
                <div style="max-height: 300px; overflow-y: auto; margin-top: 1rem;">
                    <table style="width: 100%; text-align: left; border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <th style="padding: 0.5rem;">Status</th>
                                <th style="padding: 0.5rem;">Prob</th>
                                <th style="padding: 0.5rem;">Risk</th>
                            </tr>
                        </thead>
                        <tbody id="batch-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
