{% extends "base.html" %}

{% block content %}
<div class="fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>System Dashboard</h2>
        <span class="text-muted">Last Updated: <span id="last-update">Loading...</span></span>
    </div>

    <div id="stats-container" class="grid grid-3 mb-4">
        <div class="card text-center">
            <h4 class="text-muted mb-2">Total Predictions</h4>
            <p class="h1" id="total-predictions">Loading...</p>
        </div>
        <div class="card text-center">
            <h4 class="text-muted mb-2">Fraud Detected</h4>
            <p class="h1 text-danger" id="fraud-detected">Loading...</p>
        </div>
        <div class="card text-center">
            <h4 class="text-muted mb-2">Model Accuracy</h4>
            <p class="h1 text-success" id="accuracy">Loading...</p>
        </div>
    </div>

    <div class="card">
        <h3>Recent Activity</h3>
        <p class="text-muted">Real-time transaction monitoring visualization would go here.</p>
        <div
            style="height: 300px; background: rgba(255,255,255,0.05); border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; margin-top: 1rem;">
            <span class="text-muted"><i class="fas fa-chart-area"></i> Chart Placeholder</span>
        </div>
    </div>
</div>
{% endblock %}
