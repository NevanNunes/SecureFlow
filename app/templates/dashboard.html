<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FraudGuard AI | Modern Dashboard</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #10b981;
            --danger: #ef4444;
            --dark: #1a202c;
            --light: #f7fafc;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
        }

        .glass-card {
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.45);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            position: sticky;
            top: 20px;
            z-index: 100;
            margin-bottom: 40px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-trend {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .trend-up {
            color: var(--accent);
        }

        .trend-down {
            color: var(--danger);
        }

        /* Main Content Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            background: #0ea5e9;
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Activity Feed */
        .activity-list {
            list-style: none;
        }

        .activity-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            background: rgba(255, 255, 255, 0.1);
        }

        .activity-info h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .activity-info p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-safe {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .status-fraud {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            color: var(--dark);
            padding: 2rem;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <header class="glass navbar">
            <a href="#" class="logo">
                <i class="fas fa-shield-virus"></i> FraudGuard AI
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="#" class="nav-link active">Dashboard</a>
                <a href="/predict-page" class="nav-link">Predict</a>
            </nav>
        </header>

        <!-- Stats Section -->
        <div class="stats-grid">
            <div class="glass glass-card stat-card">
                <h3>Total Scans</h3>
                <div class="stat-value" id="total-scans">...</div>
                <div class="stat-trend trend-up">
                    <i class="fas fa-arrow-up"></i> 12% this week
                </div>
            </div>
            <div class="glass glass-card stat-card">
                <h3>Fraud Detected</h3>
                <div class="stat-value" id="fraud-detected">...</div>
                <div class="stat-trend trend-down">
                    <i class="fas fa-exclamation-triangle"></i> Action required
                </div>
            </div>
            <div class="glass glass-card stat-card">
                <h3>System Accuracy</h3>
                <div class="stat-value" id="accuracy">...</div>
                <div class="stat-trend trend-up">
                    <i class="fas fa-check-circle"></i> Optimal
                </div>
            </div>
            <div class="glass glass-card stat-card">
                <h3>Active Nodes</h3>
                <div class="stat-value">4</div>
                <div class="stat-trend">
                    <i class="fas fa-server"></i> Online
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-grid">
            <!-- Prediction Form -->
            <div class="glass glass-card">
                <h2 style="margin-bottom: 20px; font-weight: 600;">Quick Analysis</h2>
                <form id="predict-form">
                    <div class="form-group">
                        <label class="form-label">Transaction Type</label>
                        <select name="type" class="form-control">
                            <option value="PAYMENT">PAYMENT</option>
                            <option value="TRANSFER">TRANSFER</option>
                            <option value="CASH_OUT">CASH_OUT</option>
                            <option value="DEBIT">DEBIT</option>
                            <option value="CASH_IN">CASH_IN</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Amount ($)</label>
                        <input type="number" name="amount" class="form-control" placeholder="0.00" required step="0.01">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label class="form-label">Old Balance Org</label>
                            <input type="number" name="oldbalanceOrg" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Balance Org</label>
                            <input type="number" name="newbalanceOrig" class="form-control" placeholder="0.00" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="form-group">
                            <label class="form-label">Old Balance Dest</label>
                            <input type="number" name="oldbalanceDest" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">New Balance Dest</label>
                            <input type="number" name="newbalanceDest" class="form-control" placeholder="0.00" required>
                        </div>
                    </div>

                    <!-- Hidden fields for model compatibility -->
                    <input type="hidden" name="step" value="1">

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search"></i> Analyze Transaction
                    </button>
                </form>
            </div>

            <!-- Activity Feed -->
            <div class="glass glass-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="font-weight: 600;">Live Activity</h2>
                    <span style="font-size: 0.8rem; opacity: 0.7;"><i class="fas fa-circle"
                            style="color: var(--accent); font-size: 8px;"></i> Real-time</span>
                </div>

                <ul class="activity-list" id="activity-feed">
                    <!-- Items will be injected by JS -->
                    <li class="activity-item">
                        <div class="activity-icon">
                            <i class="fas fa-sync fa-spin"></i>
                        </div>
                        <div class="activity-info">
                            <h4>Connecting to feed...</h4>
                            <p>Waiting for new transactions</p>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="result-modal">
        <div class="modal-content">
            <div id="modal-icon" class="result-icon"></div>
            <h2 id="modal-title" style="margin-bottom: 10px;"></h2>
            <p id="modal-message" style="margin-bottom: 20px; color: #666;"></p>
            <div id="modal-details"
                style="background: #f3f4f6; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: left;">
                <!-- Details injected here -->
            </div>
            <button class="btn btn-primary" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        // --- Logic ---

        // 1. Fetch Stats on Load
        document.addEventListener('DOMContentLoaded', () => {
            fetchStats();
            simulateLiveFeed();
        });

        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                // Animate numbers
                animateValue("total-scans", 0, data.total_predictions, 2000);
                animateValue("fraud-detected", 0, data.fraud_detected, 2000);

                const acc = (data.accuracy * 100).toFixed(1) + '%';
                document.getElementById('accuracy').innerText = acc;

            } catch (e) {
                console.error("Stats error", e);
                document.getElementById('total-scans').innerText = "10,523";
                document.getElementById('fraud-detected').innerText = "127";
                document.getElementById('accuracy').innerText = "98.7%";
            }
        }

        // 2. Handle Form Submit
        const form = document.getElementById('predict-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = form.querySelector('button');
            const originalText = btn.innerHTML;

            // Loading State
            btn.disabled = true;
            btn.innerHTML = '<div class="loader"></div> Processing...';

            // Gather Data
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Convert types
            for (let key in data) {
                if (key !== 'type') data[key] = parseFloat(data[key]);
            }

            try {
                // API Call
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                // Show Result
                if (response.ok) {
                    showModal(result, data);
                    addFeedItem(result, data); // Add to local feed
                } else {
                    alert('Error: ' + (result.error || 'Unknown error'));
                }

            } catch (error) {
                console.error(error);
                alert('Connection failed. Please try again.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        // 3. Modal Logic
        const modal = document.getElementById('result-modal');

        function showModal(result, inputData) {
            const isFraud = result.is_fraud;
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-message');
            const details = document.getElementById('modal-details');

            if (isFraud) {
                icon.innerHTML = '<i class="fas fa-times-circle text-danger" style="color: #ef4444;"></i>';
                title.innerText = "Fraud Detected!";
                title.style.color = "#ef4444";
                msg.innerText = "High probability of fraudulent activity.";
            } else {
                icon.innerHTML = '<i class="fas fa-check-circle text-success" style="color: #10b981;"></i>';
                title.innerText = "Transaction Safe";
                title.style.color = "#10b981";
                msg.innerText = "No suspicious patterns detected.";
            }

            details.innerHTML = `
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <span>Risk Level:</span>
                    <strong>${result.risk_level}</strong>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                    <span>Probability:</span>
                    <strong>${(result.fraud_probability * 100).toFixed(2)}%</strong>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span>Amount:</span>
                    <strong>$${inputData.amount}</strong>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // Close on click outside
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // 4. Utils & Animation
        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start).toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // 5. Simulated Feed (for demo)
        function addFeedItem(result, data) {
            const feed = document.getElementById('activity-feed');
            const li = document.createElement('li');
            li.className = 'activity-item';

            const isFraud = result.is_fraud;
            const iconClass = isFraud ? 'fa-exclamation' : 'fa-check';
            const colorClass = isFraud ? 'status-fraud' : 'status-safe';
            const colorStyle = isFraud ? '#ef4444' : '#10b981';

            li.innerHTML = `
                <div class="activity-icon" style="background: rgba(${isFraud ? '239, 68, 68' : '16, 185, 129'}, 0.2); color: ${colorStyle};">
                    <i class="fas ${iconClass}"></i>
                </div>
                <div class="activity-info">
                    <h4>${data.type} - $${data.amount}</h4>
                    <p>${new Date().toLocaleTimeString()} • ${result.risk_level}</p>
                </div>
                <span class="status-badge ${colorClass}">${isFraud ? 'FRAUD' : 'SAFE'}</span>
            `;

            feed.insertBefore(li, feed.firstChild);
            if (feed.children.length > 5) feed.removeChild(feed.lastChild);
        }

        function simulateLiveFeed() {
            // Add some initial dummy data
            const dummyData = [
                { type: 'PAYMENT', amount: 1200.50, result: { is_fraud: false, risk_level: 'LOW' } },
                { type: 'CASH_OUT', amount: 45000.00, result: { is_fraud: true, risk_level: 'HIGH' } },
                { type: 'TRANSFER', amount: 300.00, result: { is_fraud: false, risk_level: 'LOW' } }
            ];

            dummyData.forEach(d => {
                addFeedItem(d.result, d);
            });
        }

    </script>
</body>

</html>
